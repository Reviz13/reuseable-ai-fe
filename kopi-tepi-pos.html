<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopi Tepi POS dengan Asisten AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#E8ECE5; --panel:#F5F7F2; --raised:#FFFFFF; --ink:#17231E; --muted:#56655D; --line:#D2D9D0; --line-2:#B7C2B6;
  --accent:#1E6A45; --accent-ink:#FFFFFF; --accent-soft:#D5E7DB;
  --gold:#E7A63A; --gold-ink:#3A2606; --gold-soft:#F7E6C4;
  --danger:#A8382B; --danger-soft:#F6DCD7;
  --kopi-bg:#EBDDCF; --kopi-ink:#5B3A21;
  --nonkopi-bg:#D7E9DD; --nonkopi-ink:#1E5536;
  --makanan-bg:#F5E4C3; --makanan-ink:#74490A;
  --shadow:0 1px 0 rgba(23,35,30,.05),0 14px 34px -18px rgba(23,35,30,.35);
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ai-inset-top:92px; --ai-inset-bottom:20px; --ai-inset-left:20px; --ai-inset-right:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1613; --panel:#151E1A; --raised:#1B2621; --ink:#E5ECE7; --muted:#9AA9A0; --line:#28352F; --line-2:#3A4B42;
    --accent:#4DB37D; --accent-ink:#06180E; --accent-soft:#1D3A2B;
    --gold:#F0B556; --gold-ink:#2B1B03; --gold-soft:#3A2D14;
    --danger:#EC7F70; --danger-soft:#3D1F1B;
    --kopi-bg:#33271D; --kopi-ink:#EBCDB2;
    --nonkopi-bg:#1C3427; --nonkopi-ink:#ABDEBF;
    --makanan-bg:#3A2D14; --makanan-ink:#F1CF8F;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1613; --panel:#151E1A; --raised:#1B2621; --ink:#E5ECE7; --muted:#9AA9A0; --line:#28352F; --line-2:#3A4B42;
  --accent:#4DB37D; --accent-ink:#06180E; --accent-soft:#1D3A2B;
  --gold:#F0B556; --gold-ink:#2B1B03; --gold-soft:#3A2D14;
  --danger:#EC7F70; --danger-soft:#3D1F1B;
  --kopi-bg:#33271D; --kopi-ink:#EBCDB2;
  --nonkopi-bg:#1C3427; --nonkopi-ink:#ABDEBF;
  --makanan-bg:#3A2D14; --makanan-ink:#F1CF8F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:84px minmax(0,1fr) 372px;height:100%}

.rail{display:flex;flex-direction:column;align-items:center;padding:20px 0;border-right:1px solid var(--line);background:var(--panel)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.nav{margin:auto 0;display:flex;flex-direction:column;gap:6px}
.navbtn{width:64px;padding:10px 0 8px;border:0;border-radius:16px;background:none;color:var(--muted);display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:500}
.navbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:20px;padding:20px 32px 16px;flex-wrap:wrap}
.outlet h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.outlet p{margin:4px 0 0;color:var(--muted);font-size:13px}
.search{flex:1;min-width:180px;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.search svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round}
.search input{border:0;background:none;outline:none;color:var(--ink);font:inherit;width:100%}
.search:focus-within{border-color:var(--accent)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.view{flex:1;min-height:0;overflow:auto;padding:4px 32px 40px}
.view[hidden]{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.card{position:relative;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .1s}
.card:hover{border-color:var(--line-2)}
.card:active{transform:scale(.98)}
.tile{aspect-ratio:5/4;border-radius:14px;display:grid;place-items:center}
.tile svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile[data-cat="kopi"]{background:var(--kopi-bg);color:var(--kopi-ink)}
.tile[data-cat="nonkopi"]{background:var(--nonkopi-bg);color:var(--nonkopi-ink)}
.tile[data-cat="makanan"]{background:var(--makanan-bg);color:var(--makanan-ink)}
.card .nm{font-weight:500;font-size:15px;line-height:1.25;padding:0 4px}
.card .pr{font-family:var(--display);font-weight:500;font-size:17px;padding:0 4px;letter-spacing:-.01em}
.card .q{position:absolute;top:16px;right:16px;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600}
.empty-grid{color:var(--muted);padding:40px 0}

.till{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line);padding:22px 22px 100px}
.till-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.till-hd h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.till-hd span{color:var(--muted);font-size:13px}
.till-hd button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.till-hd button:disabled{visibility:hidden}
.paper-wrap{flex:1;min-height:180px;position:relative;overflow:hidden}
.paper{position:absolute;inset:0;overflow:auto;background:#FFFDF6;color:#2A2723;font-family:var(--mono);font-size:13px;line-height:1.5;padding:18px 18px 30px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x}
.paper.out{animation:printout .7s cubic-bezier(.5,0,.75,0) forwards}
.paper.in{animation:printin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes printout{to{transform:translateY(-105%)}}
@keyframes printin{from{transform:translateY(100%)}to{transform:none}}
.rc-head{text-align:center;margin-bottom:10px}
.rc-head b{display:block;font-weight:500;letter-spacing:.12em;font-size:14px}
.rc-head small{display:block;color:#6E685F;font-size:11.5px}
.rule{border:0;border-top:1px dashed #B9B2A6;margin:10px 0}
.rc-line{padding:6px 0}
.rc-line .n{display:block}
.rc-line .row{display:flex;align-items:center;gap:8px;color:#5C564D}
.rc-line .row .amt{margin-left:auto;color:#2A2723}
.step{display:inline-flex;align-items:center;border:1px solid #D6CFC2;border-radius:999px}
.step button{border:0;background:none;width:26px;height:24px;color:#2A2723;font-family:var(--mono);font-size:15px;line-height:1}
.step button:hover{background:#F1EBDF}
.step span{min-width:18px;text-align:center}
.rc-empty{color:#7D766B;text-align:center;padding:28px 6px}
.rc-tot{display:flex;justify-content:space-between}
.rc-tot.big{font-size:16px;font-weight:500;margin-top:4px}
.pay{margin-top:16px;display:grid;gap:10px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 0;font-size:14px;font-weight:500;color:var(--muted)}
.methods button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.paybtn{border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:19px;padding:16px;letter-spacing:-.01em}
.paybtn:disabled{opacity:.4;cursor:not-allowed}

.sec-h{display:flex;align-items:baseline;gap:12px;margin:8px 0 16px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.list{background:var(--raised);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tx{display:grid;grid-template-columns:64px minmax(0,1fr) 84px 120px;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .t{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tx .it{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .it small{display:block;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.tx .m{font-size:13px;color:var(--muted)}
.tx .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tx.new{background:var(--gold-soft)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px}
.stat h3{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.stat .range{font-size:12px;color:var(--muted)}
.stat .big{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:10px 0 12px;font-variant-numeric:tabular-nums}
.stat dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.stat dt{color:var(--muted)}
.stat dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.warn{margin-top:12px;font-size:12.5px;color:var(--makanan-ink);background:var(--makanan-bg);border-radius:10px;padding:8px 10px}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.panel h3{margin:0 0 4px;font-family:var(--display);font-size:18px;font-weight:700}
.panel > p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.bars{overflow-x:auto}
.bars-in{display:flex;align-items:flex-end;gap:5px;height:150px;min-width:520px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent-soft);min-height:2px}
.bar.today i{background:var(--gold)}
.bar b{font-weight:400;font-size:11px;color:var(--muted);font-family:var(--mono);height:14px}
.audit{width:100%;border-collapse:collapse;font-size:13px}
.audit-wrap{overflow-x:auto}
.audit th{text-align:left;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.audit td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.audit tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.toggle{display:flex;align-items:center;gap:12px;font-size:14px;cursor:pointer}
.toggle input{width:40px;height:22px;appearance:none;-webkit-appearance:none;background:var(--line-2);border-radius:999px;position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked{background:var(--danger)}
.toggle input:checked::after{transform:translateX(18px)}
.locked{background:var(--raised);border:1px dashed var(--line-2);border-radius:20px;padding:48px 24px;text-align:center;color:var(--muted)}
.locked h3{color:var(--ink);font-family:var(--display);font-size:20px;margin:0 0 6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1080px){
  .app{grid-template-columns:76px minmax(0,1fr) 330px}
  .top{padding:18px 22px 14px}.view{padding:4px 22px 40px}
  .stats{grid-template-columns:1fr}
}
@media (max-width:820px){
  :root{--ai-inset-top:84px}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto;min-height:100%}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:5}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .rail{top:env(safe-area-inset-top,0px)}
  .nav{margin:0 0 0 auto;flex-direction:row}
  .navbtn{width:auto;padding:8px 12px;grid-auto-flow:column;gap:6px}
  .main,.view{overflow:visible}
  .till{border-left:0;border-top:1px solid var(--line);padding-bottom:110px}
  .paper-wrap{min-height:260px}
  .tx{grid-template-columns:52px minmax(0,1fr) 100px}
  .tx .m{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{aspect-ratio:4/3}
  .who{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Menu utama">
    <div class="logo" aria-hidden="true">kt</div>
    <div class="nav">
      <button class="navbtn" data-view="kasir" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="11" rx="2"/><path d="M8 19.5h8M12 15v4.5"/></svg>Kasir</button>
      <button class="navbtn" data-view="riwayat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12h6"/></svg>Riwayat</button>
      <button class="navbtn" data-view="laporan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>Laporan</button>
    </div>
  </nav>

  <div class="main">
    <header class="top">
      <div class="outlet">
        <h1>Kopi Tepi</h1>
        <p id="outlet-sub">Outlet Kemang</p>
      </div>
      <label class="search" id="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <span class="sr">Cari menu</span>
        <input id="search" type="search" placeholder="Cari menu" autocomplete="off">
      </label>
      <div class="who">
        <span id="who-label">Masuk sebagai</span>
        <div class="seg" role="group" aria-labelledby="who-label">
          <button data-role="owner" aria-pressed="true">Rina, pemilik</button>
          <button data-role="cashier" aria-pressed="false">Dimas, kasir</button>
        </div>
      </div>
    </header>

    <section class="view" id="view-kasir" aria-label="Kasir">
      <div class="chips" role="group" aria-label="Kategori" id="cats"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="view" id="view-riwayat" aria-label="Riwayat transaksi" hidden></section>
    <section class="view" id="view-laporan" aria-label="Laporan" hidden></section>
  </div>

  <aside class="till" aria-label="Pesanan">
    <div class="till-hd">
      <h2>Pesanan</h2>
      <span id="order-no"></span>
      <button id="clear" type="button">Kosongkan</button>
    </div>
    <div class="paper-wrap"><div class="paper" id="paper" tabindex="0" aria-label="Struk pesanan"></div></div>
    <div class="pay">
      <div class="methods" role="group" aria-label="Metode pembayaran" id="methods">
        <button aria-pressed="true" data-m="Tunai">Tunai</button>
        <button aria-pressed="false" data-m="QRIS">QRIS</button>
        <button aria-pressed="false" data-m="Kartu">Kartu</button>
      </div>
      <button class="paybtn" id="paybtn" disabled>Bayar</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Micro frontend: satu tag ini yang ditempel ke aplikasi mana pun -->
<ai-assistant id="assistant" position="bottom-right" app-name="Asisten Tepi"></ai-assistant>

<script>
(function(){
'use strict';

/* ============================================================
   Shared helpers
   ============================================================ */
const OFF = 7 * 3600e3, DAY = 86400e3; // WIB = UTC+7, no DST
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const rp = (n, nb) => 'Rp' + (nb ? '\u00A0' : ' ') + Math.round(n).toLocaleString('id-ID');
const num = n => Math.round(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const delay = ms => new Promise(r => setTimeout(r, ms));
function wib(ms){ const d = new Date(ms + OFF); return {y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), dow:d.getUTCDay(), h:d.getUTCHours(), mi:d.getUTCMinutes()}; }
const wibStart = (y,m,d) => Date.UTC(y,m,d) - OFF;
const hhmm = ms => { const p = wib(ms); return String(p.h).padStart(2,'0') + '.' + String(p.mi).padStart(2,'0'); };
const dayLabel = ms => { const p = wib(ms); return p.d + ' ' + MONTHS[p.m] + ' ' + p.y; };
const ymd = ms => { const p = wib(ms); return p.y + '-' + String(p.m+1).padStart(2,'0') + '-' + String(p.d).padStart(2,'0'); };
function rangeLabel(from, to){
  const a = wib(from), b = wib(to - 1);
  if (a.y === b.y && a.m === b.m && a.d === b.d) return a.d + ' ' + MONTHS[a.m] + ' ' + a.y;
  if (a.y === b.y && a.m === b.m) return a.d + '\u2013' + b.d + ' ' + MONTHS[a.m] + ' ' + a.y;
  if (a.y === b.y) return a.d + ' ' + MONTHS[a.m] + ' \u2013 ' + b.d + ' ' + MONTHS[b.m] + ' ' + a.y;

function seedTransactions(now){
  const p = wib(now), first = wibStart(p.y, p.m - 1, 1), today = wibStart(p.y, p.m, p.d);
  const totalW = PRODUCTS.reduce((s, x) => s + x.w, 0), out = [];
  for (let day = first; day <= today; day += DAY){
    const r = mulberry32(Math.round(day / DAY) * 9301 + 49297);
    const dp = wib(day), weekend = dp.dow === 0 || dp.dow === 6;
    const n = Math.floor((weekend ? 34 : 22) + r() * 12);
    const stamps = [];
    for (let i = 0; i < n; i++) stamps.push(day + (7 + r() * 14.5) * 3600e3);
    stamps.sort((a, b) => a - b);
    let seq = 0;
    for (const ts of stamps){
      if (ts > now) break;
      const lines = 1 + Math.floor(r() * r() * 3.4), items = {};
      for (let l = 0; l < lines; l++){
        let k = r() * totalW, prod = PRODUCTS[0];
        for (const x of PRODUCTS){ k -= x.w; if (k <= 0){ prod = x; break; } }
        const q = r() < .15 ? 2 : 1;
        if (items[prod.id]) items[prod.id].qty += q;
        else items[prod.id] = {pid:prod.id, name:prod.name, qty:q, price:prod.price, cost:prod.cost};
      }
      const mr = r();
      seq++;
      out.push({ id:'TRX-' + ymd(day).replace(/-/g,'').slice(2) + '-' + String(seq).padStart(3,'0'), ts:Math.round(ts),
        items:Object.values(items), method: mr < .45 ? 'QRIS' : mr < .85 ? 'Tunai' : 'Kartu', cashier: r() < .5 ? 'Dimas' : 'Sari' });
    }
  }
  return out;
}

const POSBackend = (function(){
  const now = Date.now();
  const seeded = seedTransactions(now);
  const firstTs = seeded.length ? seeded[0].ts : now;
  const saved = store.get('kopitepi.tx.v1', []).filter(t => t && t.ts >= firstTs && t.ts <= now + DAY);
  const TX = seeded.concat(saved).sort((a, b) => a.ts - b.ts);
  const AUDIT = [];
  let down = false;
  function total(t){ return t.items.reduce((s, i) => s + i.price * i.qty, 0); }
  return {
    get down(){ return down; }, set down(v){ down = !!v; },
    audit: AUDIT,
    transactions(){ return TX; },
    total,
    addTransaction(t){ TX.push(t); store.set('kopitepi.tx.v1', saved.concat([t]).slice(-300)); saved.push(t); },
    todaySeq(){ const p = wib(Date.now()), s = wibStart(p.y, p.m, p.d); return TX.filter(t => t.ts >= s).length + 1; },
    issueToken(user){
      const payload = { sub:user.id, name:user.name, role:user.role, outlet_id:OUTLET.id, outlet:OUTLET.name + ' ' + OUTLET.branch, tz:'Asia/Jakarta', exp:Date.now() + 5 * 60e3 };
      return 'demo.' + btoa(JSON.stringify(payload)) + '.sig';
    },
    // GET /internal/reports/profit?outlet_id&from&to  (computed by POS, never by the AI)
    getProfit(outletId, from, to){
      if (outletId !== OUTLET.id) throw new Error('Outlet tidak dikenal.');
      let sales = 0, cogs = 0, tx = 0; const missing = new Map();
      for (const t of TX){
        if (t.ts < from || t.ts >= to) continue;
        tx++;
        for (const i of t.items){
          sales += i.price * i.qty;
          if (i.cost == null) missing.set(i.pid, i.name); else cogs += i.cost * i.qty;
        }
      }
      return { sales, cogs, profit:sales - cogs, transactions:tx, missing_cost_items:missing.size, missing_cost_names:[...missing.values()], as_of:Math.min(Date.now(), to) };
    },
    dailyProfit(from, to){
      const days = [];
      for (let d = from; d < to; d += DAY) days.push({ from:d, ...this.getProfit(OUTLET.id, d, Math.min(d + DAY, to)) });
      return days;
    }
  };
})();

function searchSop(q){
  const toks = String(q).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(t => t.length > 2 && !STOP.has(t));
  if (!toks.length) return [];
  return SOP.map(s => {
    const hay = (s.title + ' ' + s.kw).toLowerCase(), body = s.text.toLowerCase();
    let score = 0;
    for (const t of toks){ if (hay.includes(t)) score += 3; else if (body.includes(t)) score += 1; }
    return {s, score};
  }).filter(x => x.score >= 3).sort((a, b) => b.score - a.score).slice(0, 3).map(x => x.s);
}

const AIPlatform = (function(){
  let mode = 'checking', sample = null;
  const listeners = new Set();
  const setMode = m => { mode = m; listeners.forEach(f => f(m)); };
  const ready = (async () => {
    try {
      if (!window.claude || typeof window.claude.use !== 'function'){ setMode('offline'); return; }
      sample = await window.claude.use('sample');
      if (!sample){ setMode('offline'); return; }
      const lim = await sample.limits().catch(() => null);
      setMode(lim && lim.tools ? 'ai' : 'offline');
    } catch(e){ setMode('offline'); }
  })();

  function verifyToken(token){
    try {
      const parts = String(token).split('.');
      const c = JSON.parse(atob(parts[1]));
      if (!c.exp || c.exp < Date.now()) throw 0;
      return c;
    } catch(e){ const err = new Error('Sesi berakhir. Muat ulang aplikasi.'); err.code = 'session_expired'; throw err; }
  }
  function resolvePeriod(period, s, e){
    const now = Date.now(), p = wib(now), today = wibStart(p.y, p.m, p.d), wk = today - ((p.dow + 6) % 7) * DAY;
    const mk = (from, to, name) => ({ from, to, name, label:rangeLabel(from, to) });
    switch (period){
      case 'today': return mk(today, now, 'hari ini');
      case 'yesterday': return mk(today - DAY, today, 'kemarin');
      case 'this_week': return mk(wk, now, 'minggu ini');
      case 'last_week': return mk(wk - 7 * DAY, wk, 'minggu lalu');
      case 'this_month': return mk(wibStart(p.y, p.m, 1), now, 'bulan ini');
      case 'last_month': return mk(wibStart(p.y, p.m - 1, 1), wibStart(p.y, p.m, 1), 'bulan lalu');
      case 'custom': {
        const re = /^\d{4}-\d{2}-\d{2}$/;
        if (!re.test(s || '') || !re.test(e || '')) throw new Error('Tanggal harus berformat YYYY-MM-DD.');
        const P = x => { const [y, m, d] = x.split('-').map(Number); return wibStart(y, m - 1, d); };
        const f = P(s), t = P(e) + DAY;
        if (t <= f) throw new Error('Tanggal akhir harus sama atau sesudah tanggal awal.');
        if (f > now) throw new Error('Tanggal tidak boleh di masa depan.');
        if ((t - f) / DAY > 92) throw new Error('Rentang maksimal 92 hari.');
        return mk(f, Math.min(t, now), 'periode pilihan');
      }
      default: throw new Error('Periode tidak dikenal.');
    }
  }
  function log(claims, tool, detail, ok){
    POSBackend.audit.unshift({ ts:Date.now(), user:claims.name, role:claims.role, tool, detail, ok });
    if (POSBackend.audit.length > 50) POSBackend.audit.pop();
    document.dispatchEvent(new CustomEvent('audit-updated'));
  }

  // Tool: identity comes ONLY from verified claims, never from the model
  async function getProfit(input, claims){
    const period = String(input && input.period || '');
    if (claims.role !== 'owner'){ log(claims, 'get_profit', period || '-', false); return { error:'FORBIDDEN', message:'Hanya pemilik toko yang dapat melihat profit.' }; }
    let r;
    try { r = resolvePeriod(period, input.start_date, input.end_date); }
    catch(e){ log(claims, 'get_profit', period || '-', false); return { error:'INVALID_PERIOD', message:e.message }; }
    await delay(450);
    if (POSBackend.down){ log(claims, 'get_profit', r.label, false); return { error:'POS_UNAVAILABLE', message:'Sistem POS tidak dapat dihubungi.' }; }
    const d = POSBackend.getProfit(claims.outlet_id, r.from, r.to);
    log(claims, 'get_profit', r.label, true);
    return { period, period_name:r.name, label:r.label, sales:d.sales, cogs:d.cogs, profit:d.profit,
      sales_rp:rp(d.sales), cogs_rp:rp(d.cogs), profit_rp:rp(d.profit), transactions:d.transactions,

  }

  function detectPeriod(q){

    ];
    const input = [{ role:'user', content:rules(claims) }, ...turns];
    const res = await sample(input, { tools, modelTier:'quick', signal, onText:({ text }) => onText(text) });
    return res.text;
  }

  // Guardrail: every rupiah figure in the answer must come from a tool result or SOP
  function guardNumbers(text, ctx){
    const allowed = new Set();
    for (const r of ctx.results) if (!r.error) [r.sales, r.cogs, r.profit, Math.abs(r.profit)].forEach(v => allowed.add(String(Math.round(v))));
    for (const s of ctx.sop) (s.text.match(/Rp\s?[\d.]+/g) || []).forEach(m => allowed.add(m.replace(/\D/g, '')));
    const found = (text.match(/Rp\.?\s?-?[\d.,]+/gi) || []).map(m => m.replace(/[.,]+$/, '').replace(/\D/g, '')).filter(Boolean);
    return found.every(f => allowed.has(f));
  }

  async function chat({ turns, token, signal, onText, onStep }){
    const claims = verifyToken(token);
    await ready;
    let ctx = { results:[], sop:[] }, text, note = null;
    const lastUser = turns[turns.length - 1].content;
    if (mode === 'ai'){
      try { text = await llmAnswer(turns, claims, ctx, onText, onStep, signal); }
      catch(e){
        if (e && e.code === 'cancelled') throw e;
        if (e && e.code === 'rate_limited'){ const er = new Error('Terlalu banyak permintaan ke AI. Coba lagi sebentar lagi.'); throw er; }
        const permanent = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','tools_unavailable'];
        if (e && permanent.includes(e.code)){ setMode('offline'); note = 'AI tidak diizinkan di tampilan ini, jadi saya beralih ke mode offline.'; }
        else note = 'Layanan AI sedang bermasalah, jawaban ini dari mode offline.';
        ctx = { results:[], sop:[] };
        text = await ruleAnswer(lastUser, claims, ctx, onStep);
      }
    } else {
      text = await ruleAnswer(lastUser, claims, ctx, onStep);
    }
    if (!guardNumbers(text, ctx)){
      const lastR = ctx.results[ctx.results.length - 1];
      text = lastR ? profitText(lastR) : 'Saya hanya bisa menyebutkan angka yang berasal langsung dari sistem POS. Coba tanyakan, misalnya “profit bulan ini berapa?”';
      note = 'Jawaban disusun ulang langsung dari data POS supaya angkanya tepat.';
    }
    const ok = ctx.results.filter(r => !r.error && r.transactions).pop() || null;
    return { text, note, card:ok, sources:[...new Map(ctx.sop.map(s => [s.id, s])).values()] };
  }

  return { chat, ready, get mode(){ return mode; }, onMode(f){ listeners.add(f); f(mode); return () => listeners.delete(f); } };
})();

function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[(SOP-\d{2})\]/g, '<span class="cite" title="Sumber dokumen">$1</span>');
  const out = []; let list = null;
  for (const raw of String(src).split('\n')){
    const line = raw.trim();
    const ul = line.match(/^[-•*]\s+(.*)$/), ol = line.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol){
      const t = ul ? 'ul' : 'ol';
      if (!list || list.t !== t){ if (list) out.push('</' + list.t + '>'); out.push('<' + t + '>'); list = {t}; }
      out.push('<li>' + inline((ul || ol)[1]) + '</li>');
    } else {
      if (list){ out.push('</' + list.t + '>'); list = null; }
      if (line) out.push('<p>' + inline(line) + '</p>');
    }
  }
  if (list) out.push('</' + list.t + '>');
  return out.join('');
}

    this.el.panel.addEventListener('keydown', e => { if (e.key === 'Escape') this.close(); });
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches){ L.classList.add('hello'); setTimeout(() => L.classList.remove('hello'), 3400); }
    this.sync(); this.refreshIdentity(false);
  }
  sync(){
    const pos = this.position, name = this.getAttribute('app-name') || 'Asisten';
    this.el.nm.textContent = name;
    this.el.panel.setAttribute('aria-label', name);
    this.el.launcher.setAttribute('aria-label', 'Buka ' + name);
    this.shadowRoot.querySelectorAll('.cb').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === pos)));
    this.el.embed.textContent = '<ai-assistant position="' + pos + '" app="pos"></ai-assistant>';
  }
  setMode(m){
    if (!this.el) return;
    const on = m === 'ai';
    this.el.mode.textContent = m === 'checking' ? 'Memeriksa' : on ? 'AI aktif' : 'Mode offline';
    this.el.mode.classList.toggle('off', !on);
    this.el.mode.title = on ? 'Jawaban dibuat oleh model AI dengan tool POS' : 'Tanpa model AI: jawaban dari aturan dan SOP';
  }
  refreshIdentity(announce){
    if (!this.el) return;
    const id = this.cfg.identity();
    this.el.sub.textContent = id.subtitle;
    if (announce && this.started){ const d = document.createElement('div'); d.className = 'div'; d.textContent = id.switchText; this.el.log.append(d); this.suggest(id.suggestions); this.scroll(); }
  }
  setPosition(p, user){
    if (!POSITIONS.includes(p)) return;
    this.setAttribute('position', p);
    if (user) this.dispatchEvent(new CustomEvent('ai-position-change', { detail:{ position:p }, bubbles:true, composed:true }));
  }
  open(){
    const P = this.el.panel;
    P.hidden = false; this.el.launcher.hidden = true; this.el.launcher.setAttribute('aria-expanded', 'true');
    P.classList.remove('opening'); void P.offsetWidth; P.classList.add('opening');
    if (!this.started){ this.started = true; const id = this.cfg.identity(); const b = this.botMsg(); b.body.innerHTML = md(id.greeting); this.suggest(id.suggestions); }
    setTimeout(() => this.el.ta.focus(), 50);
  }
  close(){
    this.el.panel.hidden = true; this.el.launcher.hidden = false; this.el.launcher.setAttribute('aria-expanded', 'false');
    this.el.set.hidden = true; this.el.setb.setAttribute('aria-expanded', 'false');
    this.el.launcher.focus();
  }
  // drag to any corner, snaps to the nearest one
  cornerAt(x, y){ return (y < innerHeight / 2 ? 'top' : 'bottom') + '-' + (x < innerWidth / 2 ? 'left' : 'right'); }
  pDown(e){ if (e.button !== 0) return; this.drag = { x:e.clientX, y:e.clientY, moved:false }; try { this.el.launcher.setPointerCapture(e.pointerId); } catch(_){} }
  pMove(e){
    const d = this.drag; if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.moved && Math.hypot(dx, dy) < 6) return;
    if (!d.moved){ d.moved = true; this.el.launcher.classList.add('dragging'); this.el.targets.classList.add('on'); }
    this.el.launcher.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    const c = this.cornerAt(e.clientX, e.clientY);
    this.el.targets.querySelectorAll('.tg').forEach(t => t.classList.toggle('hot', t.dataset.c === c));
  }
  pUp(e){
    const d = this.drag; this.drag = null;
    if (!d || !d.moved) return;
    this.suppress = true;
    const L = this.el.launcher, before = L.getBoundingClientRect();
    L.style.transform = ''; L.classList.remove('dragging'); this.el.targets.classList.remove('on');
    this.setPosition(this.cornerAt(e.clientX, e.clientY), true);
    const after = L.getBoundingClientRect();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && L.animate)
      L.animate([{ transform:'translate(' + (before.left - after.left) + 'px,' + (before.top - after.top) + 'px)' }, { transform:'none' }], { duration:280, easing:'cubic-bezier(.2,.8,.2,1)' });
    setTimeout(() => { this.suppress = false; }, 50);
  }
  pCancel(){ this.drag = null; this.el.launcher.style.transform = ''; this.el.launcher.classList.remove('dragging'); this.el.targets.classList.remove('on'); }

  grow(){ const t = this.el.ta; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
  scroll(){ const l = this.el.log; l.scrollTop = l.scrollHeight; }
  userMsg(text){ const d = document.createElement('div'); d.className = 'm u'; d.textContent = text; this.el.log.append(d); this.scroll(); }
  botMsg(){
    const w = document.createElement('div'); w.className = 'm b';
    const steps = document.createElement('ul'); steps.className = 'steps'; steps.hidden = true;
    const body = document.createElement('div'); body.className = 'body';
    w.append(steps, body); this.el.log.append(w); this.scroll();
    return { w, steps, body, stepMap:{} };
  }
  suggest(list){
    if (!list || !list.length) return;
    const s = document.createElement('div'); s.className = 'sugg';
    list.forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => { s.remove(); this.send(q); }; s.append(b); });
    this.el.log.append(s); this.scroll();
  }
  step(bot, id, label, state){
    bot.steps.hidden = false;
    let li = bot.stepMap[id];
    if (!li){ li = document.createElement('li'); li.innerHTML = '<span class="dot"></span><span class="tx"></span>'; bot.steps.append(li); bot.stepMap[id] = li; }
    li.className = state === 'run' ? '' : state;
    li.querySelector('.tx').textContent = label;
    this.scroll();
  }
  setBusy(b){
    this.busy = b;
    this.el.send.innerHTML = b ? ICON.stop : ICON.send;
    this.el.send.setAttribute('aria-label', b ? 'Hentikan' : 'Kirim');
  }
  card(bot, r){
    const c = document.createElement('div'); c.className = 'data';
    c.innerHTML = '<div class="lbl">Profit ' + esc(r.period_name) + ', ' + esc(r.label) + '</div>' +
      '<div class="pf">' + esc(rp(r.profit, true)) + '</div>' +
      '<dl><dt>Penjualan</dt><dd>' + esc(rp(r.sales, true)) + '</dd><dt>Harga pokok</dt><dd>' + esc(rp(r.cogs, true)) + '</dd><dt>Transaksi</dt><dd>' + r.transactions + '</dd></dl>' +
      '<div class="src">Sumber: sistem POS, data per ' + esc(r.as_of_wib) + '</div>';
    bot.w.append(c);
  }
  feedback(bot){
    const f = document.createElement('div'); f.className = 'fb';
    f.innerHTML = '<button type="button" aria-label="Jawaban membantu" aria-pressed="false">' + ICON.up + '</button><button type="button" aria-label="Jawaban kurang tepat" aria-pressed="false">' + ICON.down + '</button><small></small>';
    const [u, d] = f.querySelectorAll('button'), s = f.querySelector('small');
    const set = (btn, other, msg) => () => { btn.setAttribute('aria-pressed', 'true'); other.setAttribute('aria-pressed', 'false'); s.textContent = msg; };
    u.onclick = set(u, d, 'Terima kasih atas masukannya.');
    d.onclick = set(d, u, 'Tercatat. Kami akan memperbaikinya.');
    bot.w.append(f);
  }
  async send(text){
    text = String(text || '').trim();
    if (!text || this.busy || !this.cfg.platform) return;
    this.el.ta.value = ''; this.grow();
    this.el.log.querySelectorAll('.sugg').forEach(s => s.remove());
    this.userMsg(text);
    this.turns.push({ role:'user', content:text });
    const bot = this.botMsg();
    bot.body.innerHTML = '<span class="think">Sedang berpikir<span>.</span><span>.</span><span>.</span></span>';
    this.setBusy(true);
    const ctl = new AbortController(); this.ctl = ctl;
    try {
      const res = await this.cfg.platform.chat({
        turns:this.turns.slice(-12), token:this.cfg.getToken(), signal:ctl.signal,
        onText:t => { bot.body.innerHTML = md(t); this.scroll(); },
        onStep:(id, label, state) => this.step(bot, id, label, state)
      });
      bot.body.innerHTML = md(res.text);
      if (res.card) this.card(bot, res.card);
      if (res.sources && res.sources.length){
        const s = document.createElement('div'); s.className = 'srcs';
        res.sources.forEach(x => { const sp = document.createElement('span'); sp.textContent = x.id + ': ' + x.src; s.append(sp); });
        bot.w.append(s);
      }
      if (res.note){ const n = document.createElement('div'); n.className = 'note'; n.textContent = res.note; bot.w.append(n); }
      this.feedback(bot);
      this.turns.push({ role:'assistant', content:res.text });
    } catch(e){
      if (e && e.code === 'cancelled'){ bot.body.innerHTML = (e.text ? md(e.text) : '') + '<p class="think">Dihentikan.</p>'; }
      else { bot.body.innerHTML = '<p>' + esc((e && e.message) || 'Terjadi kesalahan. Coba lagi.') + '</p>'; }
      this.turns.pop();
    } finally {
      this.setBusy(false); this.ctl = null; this.scroll();
    }
  }
}
if (!customElements.get('ai-assistant')) customElements.define('ai-assistant', AIAssistant);

function renderGrid(){

function cartTotal(){ let s = 0; state.cart.forEach((q, id) => s += PBY[id].price * q); return s; }

function add(id, d){

function pay(){
  if (!state.cart.size) return;
  const now = Date.now(), seq = POSBackend.todaySeq();
  const items = [...state.cart].map(([id, qty]) => { const p = PBY[id]; return { pid:id, name:p.name, qty, price:p.price, cost:p.cost }; });
  const tx = { id:'TRX-' + ymd(now).replace(/-/g,'').slice(2) + '-' + String(seq).padStart(3,'0'), ts:now, items, method:state.method, cashier:state.user.name };
  POSBackend.addTransaction(tx); state.lastId = tx.id;

  const finish = () => { state.cart.clear(); paper.classList.remove('out'); renderReceipt(); renderGrid(); if (!reduce){ paper.classList.add('in'); setTimeout(() => paper.classList.remove('in'), 460); } };
  if (reduce) finish(); else { paper.classList.add('out'); setTimeout(finish, 700); }

        : 'Halo ' + u.name + '. Saya bisa membantu soal SOP kasir, refund, QRIS, printer, dan tutup shift.',
      suggestions: owner
        ? ['Profit bulan ini berapa?', 'Profit minggu ini', 'Cara refund transaksi', 'Printer struk tidak keluar']
        : ['QRIS pending, harus apa?', 'Cara tutup shift', 'Diskon maksimal berapa?', 'Profit hari ini berapa?'],
      switchText: 'Sesi berganti ke ' + u.name + ' (' + u.roleLabel + ')'
    };
  }
});

const h = (location.hash || '').slice(1);
if (['riwayat','laporan'].includes(h)) state.view = h;
renderCats(); renderGrid(); renderReceipt(); renderView();
})();
</script>
